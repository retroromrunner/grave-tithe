<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GRAVE TITHE — a necromancy tale</title>
<style>
  html,body{margin:0;padding:0;background:#05060a;color:#cfd8c9;font-family:Georgia,'Times New Roman',serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;}
  #wrap{position:relative;width:min(98vw, calc((100vh - 46px) * 16 / 9));width:min(98vw, calc((100dvh - 46px) * 16 / 9));}
  canvas{display:block;width:100%;height:auto;background:#070a12;border:2px solid #232b3a;border-radius:6px;
    box-shadow:0 0 60px rgba(80,255,170,.07),0 0 120px rgba(0,0,0,.9);touch-action:none;}
  #hint{text-align:center;font-size:13px;color:#7d8a7a;margin-top:8px;letter-spacing:.4px;}
  #hint b{color:#b9e6c3;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="hint"><b>WASD / Arrows</b> move &nbsp;·&nbsp; hold <b>SPACE</b> at a grave to raise the dead &nbsp;·&nbsp; <b>SHIFT</b> dash &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>M</b> mute</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('game'),ctx=cv.getContext('2d');
var W=960,H=540;

/* ============================== AUDIO ============================== */
var AC=null,master=null,muted=false,ambientOn=false;
function audioInit(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    startAmbient();
  }catch(e){ AC=null; }
}
function tone(f,dur,type,vol,slideTo,delay){
  if(!AC||muted) return;
  var t=AC.currentTime+(delay||0);
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
function noiseBurst(dur,vol,freq,delay){
  if(!AC||muted) return;
  var t=AC.currentTime+(delay||0);
  var len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  var src=AC.createBufferSource(); src.buffer=buf;
  var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=0.8;
  var g=AC.createGain(); g.gain.value=vol||0.2;
  src.connect(f); f.connect(g); g.connect(master); src.start(t);
}
function sfx(name){
  if(!AC||muted) return;
  switch(name){
    case 'rattle':
      for(var i=0;i<5;i++) noiseBurst(0.05,0.16,1800+Math.random()*900,i*0.055);
      tone(140,0.25,'triangle',0.12,70); break;
    case 'raise':
      tone(196,0.4,'sine',0.2,392); tone(294,0.5,'sine',0.14,588,0.08);
      noiseBurst(0.3,0.08,500); break;
    case 'bank':
      [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(f,0.7,'sine',0.16,null,i*0.09); tone(f*2,0.4,'sine',0.05,null,i*0.09); });
      break;
    case 'bankOne': tone(783.99,0.35,'sine',0.12); tone(1568,0.25,'sine',0.04); break;
    case 'hurt': tone(220,0.3,'sawtooth',0.22,55); noiseBurst(0.2,0.2,300); break;
    case 'steal': tone(880,0.5,'sine',0.16,110); break;
    case 'feral': tone(300,0.45,'sawtooth',0.16,900); tone(317,0.45,'sawtooth',0.1,940); break;
    case 'crumble': noiseBurst(0.35,0.18,900); noiseBurst(0.3,0.12,500,0.08); break;
    case 'dash': noiseBurst(0.16,0.14,1200); break;
    case 'click': tone(660,0.08,'square',0.08); break;
    case 'thump': tone(58,0.18,'sine',0.3,40); break;
    case 'win':
      [392,523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){ tone(f,0.9,'triangle',0.16,null,i*0.13); });
      tone(65,2.2,'sine',0.2,null,0.2); break;
    case 'lose':
      [392,370,349,311,262,196].forEach(function(f,i){ tone(f,0.8,'triangle',0.16,null,i*0.2); });
      tone(49,2.4,'sine',0.22,null,0.3); break;
    case 'warn': tone(1108,0.12,'square',0.07); tone(1108,0.12,'square',0.07,null,0.18); break;
  }
}
function startAmbient(){
  if(!AC||ambientOn) return; ambientOn=true;
  var g=AC.createGain(); g.gain.value=0.045; g.connect(master);
  var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=220; f.connect(g);
  [55,55*1.007,82.4].forEach(function(fr){ var o=AC.createOscillator(); o.type='triangle'; o.frequency.value=fr; o.connect(f); o.start(); });
  var lfo=AC.createOscillator(),lg=AC.createGain(); lfo.frequency.value=0.07; lg.gain.value=60; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
  (function bell(){
    setTimeout(function(){
      if(AC&&!muted&&state==='play'){ var scale=[220,261.6,293.7,329.6,392,440]; tone(scale[Math.floor(Math.random()*scale.length)],1.6,'sine',0.035); }
      bell();
    },3500+Math.random()*5500);
  })();
}

/* ============================== INPUT ============================== */
var keys={},pressed={};
addEventListener('keydown',function(e){
  audioInit(); if(AC&&AC.state==='suspended')AC.resume();
  var k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0||e.key===' ') e.preventDefault();
  if(!keys[k]) pressed[k]=true;
  keys[k]=true; keys[e.key]=true;
  if(k==='m'){ muted=!muted; if(master) master.gain.value=muted?0:0.5; }
});
addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; keys[e.key]=false; });
function keyDown(){ for(var i=0;i<arguments.length;i++){ if(keys[arguments[i]]) return true; } return false; }
function keyHit(){ for(var i=0;i<arguments.length;i++){ if(pressed[arguments[i]]) return true; } return false; }
/* touch: true multi-touch. Every finger is tracked by its identifier with a role
   fixed where it landed: 'raise' (bottom-right pad), 'dash' (bottom-left pad),
   or 'move' (anywhere else — the keeper walks toward the touch). Roles are only
   cleared for the finger that actually lifted, so you can hold RAISE with one
   thumb and keep steering with the other. */
var touchMove=null,touchRaise=false,touchDash=false,isTouch=('ontouchstart'in window);
var touchRoles={};
function canvasPos(t){ var r=cv.getBoundingClientRect(); return {x:(t.clientX-r.left)*W/r.width, y:(t.clientY-r.top)*H/r.height}; }
function touchRoleAt(p){ if(p.x>W-170&&p.y>H-120) return 'raise'; if(p.x<170&&p.y>H-120) return 'dash'; return 'move'; }
function touchSync(){
  touchRaise=false; touchDash=false; touchMove=null;
  for(var id in touchRoles){ var t=touchRoles[id];
    if(t.role==='raise') touchRaise=true;
    else if(t.role==='dash') touchDash=true;
    else if(t.role==='move') touchMove=t.pos;
  }
}
cv.addEventListener('pointerdown',function(e){ audioInit(); if(AC&&AC.state==='suspended')AC.resume(); handleTap(canvasPos(e)); });
cv.addEventListener('touchstart',function(e){
  audioInit(); if(AC&&AC.state==='suspended')AC.resume();
  for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i],p=canvasPos(t); touchRoles[t.identifier]={role:touchRoleAt(p),pos:p}; }
  touchSync(); if(e.cancelable) e.preventDefault();
},{passive:false});
cv.addEventListener('touchmove',function(e){
  for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; if(touchRoles[t.identifier]) touchRoles[t.identifier].pos=canvasPos(t); }
  touchSync(); if(e.cancelable) e.preventDefault();
},{passive:false});
function touchEnd(e){ for(var i=0;i<e.changedTouches.length;i++){ delete touchRoles[e.changedTouches[i].identifier]; } touchSync(); }
cv.addEventListener('touchend',touchEnd);
cv.addEventListener('touchcancel',touchEnd);

/* ============================== GAME DATA ============================== */
var TITHE=12, NIGHT_LEN=150;
var state='title'; // title, play, win, lose
var paused=false, shake=0, timeG=0;
var player,train,ferals,graves,warden,parts,texts,history;
var banked,score,nightT,channel,spawnGrace,heartBeatT,introT,loseReason,finalTimeLeft;
var GRAVE_DATA=[
  {x:120,y:150,n:'LEWIS',e:'He owed the Collector too.'},
  {x:250,y:110,n:'MABEL',e:'Gone, but not done.'},
  {x:390,y:160,n:'OLD TOM',e:'He asked for one more night.'},
  {x:560,y:120,n:'PRUDENCE',e:'She kept every promise but one.'},
  {x:700,y:155,n:'SILAS',e:'Buried with his debts unpaid.'},
  {x:835,y:115,n:'AGNES',e:'The garden misses her. Mostly.'},
  {x:150,y:300,n:'WREN',e:'Small grave, loud ghost.'},
  {x:300,y:255,n:'BARTHOLOMEW',e:'It took two stones to keep him down.'},
  {x:640,y:260,n:'ODILE',e:'She danced at her own funeral.'},
  {x:800,y:295,n:'CASPER',e:'No relation. He insists.'},
  {x:200,y:430,n:'MOTHER MAUD',e:'She is still watching.'},
  {x:420,y:330,n:'FENWICK',e:'Died as he lived: arguing.'},
  {x:580,y:420,n:'LITTLE JUNE',e:'She hid the moon in her pocket.'},
  {x:760,y:435,n:'THE UNDERTAKER',e:'He buried himself. Twice.'},
  {x:480,y:250,n:'COUSIN ELI',e:'He arrived early. He always did.'},
  {x:885,y:370,n:'WIDOW FERN',e:'She outlived three husbands and one priest.'}
];
var trees=[{x:60,y:90,s:1.1},{x:900,y:80,s:1.25},{x:880,y:470,s:1.0},{x:55,y:480,s:1.15},{x:480,y:70,s:0.8}];
var tufts=[]; for(var ti=0;ti<90;ti++) tufts.push({x:20+Math.random()*920,y:90+Math.random()*430,r:Math.random()*6.28});
var fogs=[]; for(var fi=0;fi<7;fi++) fogs.push({x:Math.random()*W,y:120+Math.random()*380,s:120+Math.random()*160,v:4+Math.random()*7,o:0.05+Math.random()*0.05});
var stars=[]; for(var si=0;si<110;si++) stars.push({x:Math.random()*W,y:Math.random()*120,r:Math.random()*1.4+0.3,tw:Math.random()*6.28});

function reset(){
  player={x:W/2,y:H-90,vx:0,vy:0,dir:1,walk:0,hearts:3,invuln:0,dashT:0,dashCD:0,histPush:0};
  train=[]; ferals=[]; parts=[]; texts=[]; history=[];
  graves=GRAVE_DATA.map(function(g){ return {x:g.x,y:g.y,n:g.n,e:g.e,used:false,ph:Math.random()*6.28}; });
  warden={active:false,x:-100,y:-100,timer:8,stealCD:0,ph:0};
  banked=0; score=0; nightT=NIGHT_LEN; channel={grave:null,t:0};
  spawnGrace=3; heartBeatT=0; introT=4.2; paused=false; shake=0;
  loseReason=''; finalTimeLeft=0;
}
function addText(x,y,str,col){ texts.push({x:x,y:y,str:str,col:col||'#b9e6c3',t:0,life:1.4}); }
function burst(x,y,n,col,spd){
  for(var i=0;i<n;i++){ var a=Math.random()*6.283,v=(0.3+Math.random()*0.7)*(spd||60);
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,t:0,life:0.5+Math.random()*0.6,col:col,r:1+Math.random()*2.2}); }
}
function feralLimit(){ return Math.max(10, 20-banked*1.0); }
function damage(srcX){
  if(player.invuln>0) return;
  player.hearts--; player.invuln=1.6; shake=9; sfx('hurt');
  burst(player.x,player.y-10,16,'#e8e4da',90);
  addText(player.x,player.y-44,'STRUCK!','#ff9a8a');
  player.x+= (player.x<srcX?-1:1)*26;
  if(player.hearts<=0){ endGame(false,'The Warden\'s cold hands found you. The tithe goes unpaid.'); }
}
function endGame(won,reason){
  if(state!=='play') return;
  state=won?'win':'lose'; finalTimeLeft=Math.max(0,nightT); loseReason=reason||'';
  if(won){ score+=Math.floor(finalTimeLeft)*5; sfx('win'); burst(player.x,player.y-20,60,'#9fe8b4',130); }
  else sfx('lose');
}
function handleTap(p){
  if(state==='title'){ state='play'; reset(); sfx('click'); }
  else if(state==='win'||state==='lose'){ state='title'; sfx('click'); }
}

/* ============================== UPDATE ============================== */
function nearestGrave(){
  var best=null,bd=46;
  for(var i=0;i<graves.length;i++){ var g=graves[i]; if(g.used) continue;
    var d=Math.hypot(g.x-player.x,g.y-(player.y-6)); if(d<bd){bd=d;best=g;} }
  return best;
}
function update(dt){
  timeG+=dt;
  var i;
  for(i=parts.length-1;i>=0;i--){ var p=parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=60*dt; if(p.t>p.life) parts.splice(i,1); }
  for(i=texts.length-1;i>=0;i--){ texts[i].t+=dt; texts[i].y-=26*dt; if(texts[i].t>texts[i].life) texts.splice(i,1); }
  for(i=0;i<fogs.length;i++){ fogs[i].x+=fogs[i].v*dt; if(fogs[i].x-fogs[i].s>W) fogs[i].x=-fogs[i].s; }
  if(shake>0) shake=Math.max(0,shake-dt*22);
  if(state!=='play'||paused) return;

  if(introT>0) introT-=dt;
  nightT-=dt; spawnGrace=Math.max(0,spawnGrace-dt);
  if(nightT<=0){ nightT=0; endGame(false,'Dawn broke over the fence. The Collector does not accept excuses.'); return; }
  /* remaining-souls fail check */
  var unused=0; for(i=0;i<graves.length;i++) if(!graves[i].used) unused++;
  if(banked+train.length+ferals.length+unused<TITHE){ endGame(false,'Too many of the dead are lost. The tithe can never be paid now.'); return; }

  /* ---- movement ---- */
  var mx=0,my=0;
  if(keyDown('a','arrowleft')) mx-=1; if(keyDown('d','arrowright')) mx+=1;
  if(keyDown('w','arrowup')) my-=1; if(keyDown('s','arrowdown')) my+=1;
  if(touchMove){ var dx=touchMove.x-player.x,dy=touchMove.y-player.y,dl=Math.hypot(dx,dy); if(dl>14){ mx=dx/dl; my=dy/dl; } }
  var moving=(mx!==0||my!==0), ml=Math.hypot(mx,my)||1; mx/=ml; my/=ml;
  var wantDash=keyDown('shift')||touchDash;
  if(wantDash&&player.dashCD<=0&&player.dashT<=0&&moving){ player.dashT=0.18; player.dashCD=1.5; sfx('dash'); burst(player.x,player.y,8,'#7fd6a4',50); }
  player.dashT=Math.max(0,player.dashT-dt); player.dashCD=Math.max(0,player.dashCD-dt);
  var spd=(player.dashT>0?5.4:2.65);
  var raising=(keyDown(' ')||keyDown('e')||touchRaise)&&!!nearestGrave();
  if(raising&&!moving){
    var g=nearestGrave(); channel.grave=g;
    var prev=channel.t; channel.t+=dt/1.15;
    if(prev<1&&channel.t>=1){
      g.used=true;
      train.push({x:g.x,y:g.y+8,age:0,warned:false,bob:Math.random()*6.28});
      sfx('rattle'); setTimeout(function(){sfx('raise');},130);
      burst(g.x,g.y-8,22,'#8ff2b0',80); burst(g.x,g.y-8,10,'#d8ffe2',60);
      addText(g.x,g.y-52,'RISE!','#9fe8b4'); channel.t=0; channel.grave=null;
    }
  } else { channel.t=Math.max(0,channel.t-dt*2.2); if(!nearestGrave()) channel.grave=null; }
  if(!(raising&&!moving)){
    player.x+=mx*spd*(dt*60)*0.9;
    player.y+=my*spd*(dt*60)*0.9;
  }
  if(moving&&!(raising)){ player.dir=mx!==0?Math.sign(mx):player.dir; player.walk+=dt*(player.dashT>0?14:9); }
  player.x=Math.max(26,Math.min(W-26,player.x));
  player.y=Math.max(112,Math.min(H-22,player.y));
  player.invuln=Math.max(0,player.invuln-dt);

  /* ---- path history for the train ---- */
  history.unshift({x:player.x,y:player.y});
  if(history.length>1400) history.pop();

  /* ---- skeletons ---- */
  for(i=train.length-1;i>=0;i--){ var sk=train[i]; sk.age+=dt;
    var idx=Math.min(history.length-1,(i+1)*20), tgt=history[idx]||player;
    sk.x+=(tgt.x-sk.x)*Math.min(1,dt*10); sk.y+=(tgt.y-sk.y)*Math.min(1,dt*10);
    /* stand-off ring: the train never piles onto the keeper — each skeleton holds
       at least 21px off, so the whole train stays visible around a still player */
    var pdx=sk.x-player.x,pdy=sk.y-player.y,pd=Math.hypot(pdx,pdy);
    if(pd<17){ var pa=pd>1?Math.atan2(pdy,pdx):i*2.4; sk.x=player.x+Math.cos(pa)*17; sk.y=player.y+Math.sin(pa)*17; }
    var lim=feralLimit();
    if(!sk.warned&&sk.age>lim-5){ sk.warned=true; sfx('warn'); addText(sk.x,sk.y-46,'IT STIRS…','#ffd97a'); }
    if(sk.age>=lim){
      train.splice(i,1); ferals.push({x:sk.x,y:sk.y,life:7,bob:sk.bob});
      sfx('feral'); addText(sk.x,sk.y-46,'IT TURNS ON YOU!','#ff9a8a'); shake=Math.max(shake,5);
    }
  }
  /* ---- ferals ---- */
  for(i=ferals.length-1;i>=0;i--){ var fe=ferals[i]; fe.life-=dt;
    var fa=Math.atan2(player.y-fe.y,player.x-fe.x);
    fe.x+=Math.cos(fa)*2.15*(dt*60)*0.9; fe.y+=Math.sin(fa)*2.15*(dt*60)*0.9;
    if(Math.hypot(player.x-fe.x,player.y-fe.y)<24){
      ferals.splice(i,1); burst(fe.x,fe.y-8,14,'#e8e4da',70); sfx('crumble'); damage(fe.x); if(state!=='play')return; continue;
    }
    if(fe.life<=0){ ferals.splice(i,1); burst(fe.x,fe.y-8,12,'#9aa48f',60); sfx('crumble'); addText(fe.x,fe.y-40,'It crumbles, unbanked.','#aeb9a4'); }
  }
  /* ---- banking at the mausoleum ---- */
  if(player.x>418&&player.x<542&&player.y<128&&train.length>0){
    var n=train.length; banked+=n; score+=n*100+(n>=3?(n-1)*25:0);
    for(i=0;i<n;i++) burst(480,96,6,'#9fe8b4',70);
    burst(480,96,26,'#d8ffe2',110); sfx('bank');
    addText(480,64,'+'+n+' SOUL'+(n>1?'S':'')+' — '+banked+'/'+TITHE,'#d8ffe2');
    train=[]; history=[];
    if(banked>=TITHE){ endGame(true); return; }
  }
  /* ---- warden ---- */
  if(!warden.active){
    warden.timer-=dt;
    if(warden.timer<=0&&spawnGrace<=0){
      warden.active=true; warden.chaseT=0; warden.ph=Math.random()*6.28;
      var side=Math.floor(Math.random()*3),sx,sy;
      if(side===0){ sx=Math.random()<0.5?30+Math.random()*250:W-280+Math.random()*250; sy=118; } else if(side===1){ sx=24; sy=180+Math.random()*300; } else { sx=W-24; sy=180+Math.random()*300; }
      if(Math.hypot(sx-player.x,sy-player.y)<260){ sx=W-sx; sy=140+((sy*7)%360); }
      warden.x=sx; warden.y=sy; burst(sx,sy,18,'#8a93b8',60);
    }
  } else {
    warden.chaseT=(warden.chaseT||0)+dt;
    if(warden.chaseT>14){ warden.active=false; warden.timer=4; burst(warden.x,warden.y,20,'#8a93b8',60); addText(warden.x,warden.y-44,'The Warden dissolves… for now.','#b9c2e8'); }
    var wSpd=Math.min(1.65,0.58+banked*0.03+(1-nightT/NIGHT_LEN)*0.5); // the Warden quickens as dawn nears
    /* target: player, but drifts toward the tail of the train when close */
    var tx=player.x,ty=player.y;
    if(train.length>0){ var tail=train[train.length-1]; if(Math.hypot(tail.x-warden.x,tail.y-warden.y)<Math.hypot(tx-warden.x,ty-warden.y)+40){ tx=tail.x; ty=tail.y; } }
    var wa=Math.atan2(ty-warden.y,tx-warden.x);
    warden.x+=Math.cos(wa)*wSpd*(dt*60)*0.9+Math.sin(timeG*2+warden.ph)*0.3;
    warden.y+=Math.sin(wa)*wSpd*(dt*60)*0.9;
    warden.stealCD=Math.max(0,warden.stealCD-dt);
    /* steal a trailing skeleton */
    if(train.length>0&&warden.stealCD<=0){
      for(i=train.length-1;i>=0;i--){ if(Math.hypot(train[i].x-warden.x,train[i].y-warden.y)<26){
        var st=train.splice(i,1)[0]; burst(st.x,st.y-8,18,'#8a93b8',80); sfx('steal');
        addText(st.x,st.y-46,'STOLEN BY THE WARDEN!','#b9c2e8');
        warden.active=false; warden.timer=6.5; warden.stealCD=2; break; } }
    }
    if(warden.active&&Math.hypot(player.x-warden.x,player.y-warden.y)<27&&player.dashT<=0){

  if(isTouch&&state==='play'){
    ctx.globalAlpha=touchRaise?0.9:0.5; ctx.fillStyle=touchRaise?'#4a7d55':'#2a3b2e'; ctx.beginPath(); ctx.arc(W-70,H-62,touchRaise?46:42,0,6.29); ctx.fill();
    ctx.globalAlpha=touchDash?0.9:0.5; ctx.fillStyle=touchDash?'#4a7d55':'#2a3b2e'; ctx.beginPath(); ctx.arc(70,H-62,touchDash?38:34,0,6.29); ctx.fill(); ctx.globalAlpha=1;
    txt('RAISE',W-70,H-62,14,'#d8ffe2','center',true); txt('DASH',70,H-62,12,'#d8ffe2','center',true);
    if(touchMove){ ctx.strokeStyle='rgba(216,255,226,0.65)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(touchMove.x,touchMove.y,10,0,6.29); ctx.stroke(); }
    txt('Hold RAISE at a grave — steer with your other thumb',W/2,H-14,12.5,'rgba(216,255,226,0.55)');
  }
  if(paused){ veil(0.6); txt('PAUSED',W/2,H/2-14,38,'#e8f5e2','center',true); txt('Press P to resume',W/2,H/2+26,15,'#b9e6c3'); }
  ctx.restore();
}

/* ============================== LOOP ============================== */
reset();
var lastTs=0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(ts-lastTs)/1000||0.016); lastTs=ts;
  if(state==='play'){
    if(keyHit('p')) paused=!paused;
    movingCache=(keyDown('a','arrowleft','d','arrowright','w','arrowup','s','arrowdown')||!!touchMove)&&!paused;
  }
  if(state==='title'&&keyHit('enter')){ audioInit(); state='play'; reset(); sfx('click'); }
  else if((state==='win'||state==='lose')&&keyHit('enter','r')){ state='title'; sfx('click'); }
  update(dt); draw();
  for(var k in pressed) delete pressed[k];
}
requestAnimationFrame(frame);
})();
</script>
